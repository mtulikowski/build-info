name: CI

on:
    push:
    pull_request:

jobs:
    quality:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - php: '8.1'
                      symfony: '^6.4'
                      composer_flags: '--prefer-lowest'
                    - php: '8.2'
                      symfony: '^7.4'
                      composer_flags: ''
                    - php: '8.4'
                      symfony: '^8.0'
                      composer_flags: ''

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  tools: composer:v2

            - name: Install dependencies
              run: >
                  composer update --prefer-dist --no-interaction ${{ matrix.composer_flags }}
                  --with=symfony/config:${{ matrix.symfony }}
                  --with=symfony/console:${{ matrix.symfony }}
                  --with=symfony/dependency-injection:${{ matrix.symfony }}
                  --with=symfony/filesystem:${{ matrix.symfony }}
                  --with=symfony/framework-bundle:${{ matrix.symfony }}
                  --with=symfony/http-kernel:${{ matrix.symfony }}
                  --with=symfony/process:${{ matrix.symfony }}
                  --with=symfony/twig-bundle:${{ matrix.symfony }}

            - name: Run PHPUnit
              run: php vendor/bin/phpunit --testsuite "Build Info Bundle"

            - name: Run PHPStan
              run: php vendor/bin/phpstan analyse --no-progress

            - name: Run PHP-CS-Fixer
              run: php vendor/bin/php-cs-fixer fix --dry-run --using-cache=no --allow-risky=yes
